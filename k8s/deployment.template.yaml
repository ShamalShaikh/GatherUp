apiVersion: apps/v1
kind: Deployment
metadata:
  name: gatherup-ui-deployment
  labels:
    app: gatherup-ui
spec:
  replicas: 2
  selector:
    matchLabels:
      app: gatherup-ui
  template:
    metadata:
      labels:
        app: gatherup-ui
    spec:
      containers:
        - name: gatherup-ui-container
          image: REGION-docker.pkg.dev/PROJECT_ID/REPO_NAME/IMAGE_NAME:TAG
          ports:
            - containerPort: 3000