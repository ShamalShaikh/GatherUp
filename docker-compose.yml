services:
  db:
    image: postgres:15
    environment: # This is the environment variables for the database
      POSTGRES_USER: ${POSTGRES_USER:-gatherup}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-gatherup}
      POSTGRES_DB: ${POSTGRES_DB:-gatherup}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-gatherup}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - gatherup-network

  web:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "${FLASK_PORT:-8000}:5000"
    environment:
      - FLASK_ENV=${FLASK_ENV:-development}
      - DATABASE_URL=postgresql://${POSTGRES_USER:-gatherup}:${POSTGRES_PASSWORD:-gatherup}@db:5432/${POSTGRES_DB:-gatherup}
      - MONGO_URI=mongodb://mongodb:27017/gatherup
      - JWT_SECRET_KEY=${JWT_SECRET_KEY:-test-secret-key}
      - FLASK_PORT=8000
    depends_on:
      db:
        condition: service_healthy
      mongodb:
        condition: service_started
    networks:
      - gatherup-network

  test:
    build:
      context: .
      dockerfile: Dockerfile.test
    volumes:
      - .:/app
    environment:
      - FLASK_ENV=testing
      - DATABASE_URL=postgresql://${POSTGRES_USER:-gatherup}:${POSTGRES_PASSWORD:-gatherup}@db:5432/${POSTGRES_DB:-gatherup}_test
      - TEST_DATABASE_URL=postgresql://${POSTGRES_USER:-gatherup}:${POSTGRES_PASSWORD:-gatherup}@db:5432/${POSTGRES_DB:-gatherup}_test
      - MONGO_URI=mongodb://mongodb:27017/gatherup
      - MONGO_TEST_URI=mongodb://mongodb:27017/gatherup_test
      - JWT_SECRET_KEY=${JWT_SECRET_KEY:-test-secret-key}
      - TICKETMASTER_API_KEY=test_key
      - MEETUP_API_KEY=test_key
      - EVENTBRITE_API_KEY=test_key
    depends_on:
      db:
        condition: service_healthy
      mongodb:
        condition: service_started
    networks:
      - gatherup-network
    command: tail -f /dev/null

  mongodb:
    image: mongo:6
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - gatherup-network

  redis:
    image: redis:7
    ports:
      - "6379:6379"
    networks:
      - gatherup-network

  worker:
    build:
      context: .
      dockerfile: Dockerfile
    command: celery -A workers.tasks worker --loglevel=info
    environment:
      - FLASK_ENV=${FLASK_ENV:-development}
      - MONGO_URI=mongodb://mongodb:27017/gatherup
      - REDIS_URL=redis://redis:6379/0
      - TICKETMASTER_API_KEY=${TICKETMASTER_API_KEY}
      - MEETUP_API_KEY=${MEETUP_API_KEY}
      - EVENTBRITE_API_KEY=${EVENTBRITE_API_KEY}
    depends_on:
      - redis
      - mongodb
    networks:
      - gatherup-network

  beat:
    build:
      context: .
      dockerfile: Dockerfile
    command: celery -A workers.tasks beat --loglevel=info
    environment:
      - FLASK_ENV=${FLASK_ENV:-development}
      - MONGO_URI=mongodb://mongodb:27017/gatherup
      - REDIS_URL=redis://redis:6379/0
      - TICKETMASTER_API_KEY=${TICKETMASTER_API_KEY}
    depends_on:
      - redis
      - mongodb
    networks:
      - gatherup-network

networks:
  gatherup-network:
    driver: bridge

volumes:
  postgres_data:
  mongodb_data:
